# Regression watch (hourly) and health check (daily). The watch compares each network in
# watch.json with what is served now and re-tests only when it changed or got stale (7 days),
# so a deploy that changes a network is re-tested within the hour, and quiet hours cost no
# model calls. Runs are stored in the results database; a regression fails the job.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   CRASHTEST_API_KEY   model router key (Otari)
#   CRASHTEST_ROUTER    router base URL, e.g. https://eu.api.otari.ai/api/v1
#   INGEST_TOKEN        results-database upload token (same as the Worker secret)
# Without CRASHTEST_API_KEY the job only plans (dry run) and says so.
name: Crash-test watch
on:
  schedule:
    - cron: "17 * * * *"   # watch: hourly
    - cron: "17 5 * * *"   # health: daily, 05:17 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only plan; run no tests"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: crash-test-watch
  cancel-in-progress: false

jobs:
  watch:
    if: github.event_name != 'schedule' || github.event.schedule == '17 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CRASHTEST_API_KEY: ${{ secrets.CRASHTEST_API_KEY }}
      CRASHTEST_ROUTER: ${{ secrets.CRASHTEST_ROUTER }}
      INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci --ignore-scripts || npm install --ignore-scripts
      - name: Decide mode
        id: mode
        run: |
          if [ -z "$CRASHTEST_API_KEY" ]; then
            echo "::notice::CRASHTEST_API_KEY is not set, so this is a dry run (plan only)."
            echo "flag=--dry-run" >> "$GITHUB_OUTPUT"
          elif [ -z "$INGEST_TOKEN" ]; then
            # Without storing runs, every hourly watch would re-test (and pay for) the same pairs.
            echo "::notice::INGEST_TOKEN is not set, so runs couldn't be stored; this is a dry run (plan only)."
            echo "flag=--dry-run" >> "$GITHUB_OUTPUT"
          elif [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "flag=--dry-run" >> "$GITHUB_OUTPUT"
          else
            echo "flag=" >> "$GITHUB_OUTPUT"
          fi
      - name: Run the watch
        # Exit 1 (a regression) fails the job. Exit 2 (a network or the router unreachable) is a
        # warning: hourly runs would otherwise fail every hour while someone's site is down; our
        # own sites' outages are the daily health job's to report.
        run: |
          code=0
          node scripts/ci-watch.mjs ${{ steps.mode.outputs.flag }} || code=$?
          if [ "$code" = 2 ]; then echo "::warning::Some networks or the model router could not be reached; see the summary."; exit 0; fi
          exit $code

  # Every live piece (sites, MCP servers, signatures, attestations) is up and valid, and no
  # attestation expires within 7 days. Same checks as /health; needs no secrets.
  health:
    if: github.event_name != 'schedule' || github.event.schedule == '17 5 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci --ignore-scripts || npm install --ignore-scripts
      - name: Check health
        run: node scripts/health.mjs
